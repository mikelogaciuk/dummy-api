name: Scan CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft & Grype
        run: |
          apt-get update && apt-get install -y curl
          curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b /usr/local/bin

      - name: Run Syft to generate SBOM
        run: syft . -o json > sbom.json

      - name: Run Grype scan for all severities (non-failing)
        run: grype sbom:sbom.json -o json > grype-report.json || true

      - name: Run Grype scan for CRITICAL severity (failing)
        run: grype sbom:sbom.json --fail-on critical --output table

      - name: Upload Grype report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-security-report
          path: grype-report.json

  semgrep-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install semgrep

      - name: Run Semgrep scan
        run: semgrep --config p/ci --json > semgrep-report.json

      - name: Upload Semgrep report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: semgrep-report.json

  docker-scout-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: dummy-api:scan

      - name: Run Docker Scout scan
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves,recommendations
          image: dummy-api:scan
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Docker Scout results
        run: |
          echo "Docker Scout scan completed. Results available in GitHub Actions output."

      - name: Upload Docker Scout SBOM
        if: always()
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: sbom
          image: dummy-api:scan
          write-comment: false
